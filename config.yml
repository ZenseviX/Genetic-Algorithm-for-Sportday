# Paths are relative to this config file; use --csv/--output to override.
csv_path: HR.csv
output_dir: ga_output
seed: 42
population_size: 200
generations: 300
elite_size: 5
tournament_size: 3
mutation_rate: 0.3
# Higher weights prioritize balancing these dimensions.
dept_weight: 5
gender_weight: 5
physical_weight: 2
# Stop after this many generations without improvement (0 = disable).
patience: 60
